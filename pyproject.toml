[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aifx"
version = "0.1.0"
description = "FX chart forecasting: multi-model price forecasts, walk-forward backtests and a static web dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
aifx = "aifx.cli:main"

[tool.setuptools]
packages = ["aifx"]

[tool.setuptools.package-data]
aifx = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
