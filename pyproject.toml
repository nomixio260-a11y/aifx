[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aifx"
version = "0.2.0"
description = "FX forecasting server: live forecasts on a tamper-evident ledger, scored and learned from their own results"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
llm = ["anthropic>=1.8"]
dev = ["pytest>=7", "anthropic>=1.8"]

[project.scripts]
aifx = "aifx.cli:main"

[tool.setuptools]
packages = ["aifx"]

[tool.setuptools.package-data]
aifx = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
