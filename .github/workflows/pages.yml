name: Forecast site

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 06:30 JST (after the New York close) and 12:00 JST, Monday-Friday
    - cron: "30 21 * * 1-5"
    - cron: "0 3 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forecast-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Build dashboard
        run: aifx build --out site

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          # Scheduled runs always use the default branch; their payload has no repository object.
          IS_DEFAULT: ${{ github.event_name == 'schedule' || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch) }}
        run: |
          if [ "$IS_DEFAULT" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled. Settings > Pages > Source: GitHub Actions to publish the dashboard."
          fi

      - name: Upload Pages artifact
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Upload site as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aifx-site
          path: site
          retention-days: 7

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
