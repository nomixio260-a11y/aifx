# The forecasting server. Every run is one cycle: fetch prices and news, score
# matured forecasts, learn, issue new forecasts, verify the whole ledger, then
# append the results to the `ledger` branch and publish the web page.
name: FX server

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches-ignore: [ledger]
    paths: ["aifx/**", "pyproject.toml", ".github/workflows/server.yml"]

permissions:
  contents: write   # append to the ledger branch
  pages: write
  id-token: write

concurrency:
  group: fx-server
  cancel-in-progress: false

jobs:
  cycle:
    # Only the default branch runs the live server; other branches are tested by CI.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Check out the ledger branch
        run: |
          git config user.name "aifx-server[bot]"
          git config user.email "aifx-server@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ledger >/dev/null; then
            git fetch --depth=1 origin ledger:ledger
            git worktree add state ledger
          else
            git worktree add --orphan -b ledger state
          fi
          echo "BEFORE=$(aifx head --state state)" >> "$GITHUB_ENV"

      # The rolling backtest is derived data, never part of the ledger. Keeping it
      # between runs means each cycle only adds the new origins; without it the
      # cycle simply rebuilds it.
      - name: Restore the backtest cache
        uses: actions/cache/restore@v4
        with:
          path: state/cache/backtest
          key: aifx-backtest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: aifx-backtest-

      - name: Run one cycle
        run: aifx cycle --state state --site site --audit 3 --interval 15

      - name: Verify the ledger only grew
        run: aifx verify --state state --expect-head "$BEFORE"

      - name: Append to the ledger branch (fast-forward only, never forced)
        run: |
          cd state
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "cycle $(date -u +%Y-%m-%dT%H:%MZ) head $(aifx head --state .)"
          git push origin HEAD:ledger
          echo "::notice::ledger head $(aifx head --state .)"

      - name: Save the backtest cache
        uses: actions/cache/save@v4
        with:
          path: state/cache/backtest
          key: aifx-backtest-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled. Settings > Pages > Source: GitHub Actions to publish the dashboard."
          fi

      - name: Upload the web page
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: cycle
    if: needs.cycle.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub runs the 15-minute schedule only every few hours when it is busy, so each run starts the
  # next one itself at the next quarter hour while the market is open. The schedule above stays as
  # the fallback that restarts the chain (for example after the weekend).
  next:
    needs: [cycle, deploy]
    if: ${{ always() && needs.cycle.result != 'skipped' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the next cycle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          now=$(date -u +%s)
          # the next quarter hour plus 90 seconds, so the 15-minute bar has closed
          next=$(( (now / 900 + 1) * 900 + 90 ))
          # the FX market closes from Friday 17:00 to Sunday 17:00 New York time (one more run scores Friday's last bar)
          read -r dow hm <<< "$(TZ=America/New_York date -d "@$next" +"%u %H%M")"
          hm=$((10#$hm))
          if { [ "$dow" = 5 ] && [ "$hm" -ge 1715 ]; } || [ "$dow" = 6 ] || { [ "$dow" = 7 ] && [ "$hm" -lt 1700 ]; }; then
            open=$(TZ=America/New_York date -d "$(TZ=America/New_York date -d "@$next" +%Y-%m-%d) + $(( (7 - dow) % 7 )) days 17:00" +%s)
            if [ $(( open - now )) -gt 19800 ]; then echo "market closed; the schedule restarts the chain"; exit 0; fi
            next=$(( open + 90 ))
          fi
          sleep $(( next - $(date -u +%s) > 0 ? next - $(date -u +%s) : 0 ))
          others=$(gh run list --repo "$REPO" --workflow server.yml --limit 20 --json databaseId,status \
                   --jq "[.[] | select(.status != \"completed\" and .databaseId != $RUN_ID)] | length")
          if [ "$others" != "0" ]; then echo "another run is queued or running; it continues the chain"; exit 0; fi
          gh workflow run server.yml --repo "$REPO" --ref "$REF"
          echo "::notice::next cycle started"
